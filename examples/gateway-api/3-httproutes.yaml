# Allow the HTTPRoute in "default" namespace to reference the Service in "payment" namespace.
# Without this ReferenceGrant the cross-namespace backendRef is rejected by the controller.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-default-to-payment
  namespace: payment
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: ""
      kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: default
spec:
  parentRefs:
    - name: api-gateway
  hostnames:
    - "api.local"
  rules:
    # Stripe webhook — routes directly to the payment namespace Service
    - matches:
        - path:
            type: Exact
            value: /payment/webhooks/stripe
      backendRefs:
        - name: payment
          namespace: payment
          port: 1550
    # Catch-all — routes to the main API
    - backendRefs:
        - name: api-service
          port: 80
