# Allow the HTTPRoute in "default" namespace to reference the Service in "payment" namespace.
# Without this ReferenceGrant the cross-namespace backendRef is rejected by the controller.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-api-to-payment
  namespace: payment
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: default
  to:
  - group: ""
    kind: Service
---
# Redirect all HTTP traffic to HTTPS
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-http-redirect
  namespace: default
spec:
  hostnames:
  - api.local
  parentRefs:
  - name: api-gateway
    port: 80
  rules:
  - filters:
    - requestRedirect:
        scheme: https
        statusCode: 308
      type: RequestRedirect
---
# Stripe webhook — routes directly to the payment namespace Service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-stripe-webhook
  namespace: default
spec:
  hostnames:
  - api.local
  parentRefs:
  - name: api-gateway
    port: 443
  rules:
  - backendRefs:
    - name: payment
      namespace: payment
      port: 1550
    matches:
    - path:
        type: Exact
        value: /payment/webhooks/stripe
    name: rule-0
---
# Catch-all — routes to the main API
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-default-backend
  namespace: default
spec:
  hostnames:
  - api.local
  parentRefs:
  - name: api-gateway
  rules:
  - backendRefs:
    - name: api-service
      port: 80
    name: rule-0
