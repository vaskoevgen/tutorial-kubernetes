apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-api
  template:
    metadata:
      labels:
        app: main-api
    spec:
      containers:
        - name: main-api
          image: hashicorp/http-echo:latest
          args:
            - "-text=Hello from main API service!"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: default
spec:
  selector:
    app: main-api
  ports:
    - name: service
      port: 80
      targetPort: 8080
